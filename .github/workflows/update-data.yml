name: Update Crime Data

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

# ADD THIS SECTION - Grant write permissions
permissions:
  contents: write

jobs:
  update-crime-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Add this line
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
      
      - name: Install R dependencies
        run: |
          install.packages(c('data.table', 'lubridate', 'jsonlite'))
        shell: Rscript {0}
      
      - name: Run data pipeline
        run: |
          source('crime_data_pipeline.R')
          run_full_pipeline()
        shell: Rscript {0}
      
      - name: Commit updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update crime data $(date +'%Y-%m-%d')" && git push)
